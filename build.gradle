plugins {
	id 'java'
	id 'org.springframework.boot' version '4.0.7'
	id 'io.spring.dependency-management' version '1.1.7'

	id 'checkstyle'
	id 'pmd'
	id 'jacoco'

	id 'com.github.spotbugs' version '6.5.10'
	id 'org.sonarqube' version '7.4.0.8496'

	id 'com.diffplug.spotless' version '8.9.0'
}

checkstyle {
	toolVersion = '10.15.0'
	config = resources.text.fromArchiveEntry(
			configurations.checkstyle.filter { it.name.startsWith("checkstyle-") },
			'google_checks.xml'
	)
	ignoreFailures = false
}

spotless {
	java {
		target 'src/**/*.java'
		googleJavaFormat('1.21.0')
		removeUnusedImports()
	}
}

jacocoTestReport {
	reports {
		xml.required = true
	}
}

test {
	finalizedBy jacocoTestReport
}

sonar {
	properties {
		property "sonar.projectKey", "GutnikElina_telemetry-ingestion-service"
		property "sonar.organization", "gutnikelina"
		property "sonar.host.url", "https://sonarcloud.io"
		property "sonar.coverage.jacoco.xmlReportPaths", "${layout.buildDirectory.get()}/reports/jacoco/test/jacocoTestReport.xml"
	}
}

tasks.named('sonar') {
	dependsOn test, jacocoTestReport
}

group = 'com.innowise'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-r2dbc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webflux-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

tasks.register('installGitHooks', Exec) {
	commandLine 'sh', '-c', 'chmod +x .githooks/pre-commit 2>/dev/null || true; git config core.hooksPath .githooks'
}

tasks.named('compileJava') {
	dependsOn 'installGitHooks'
}
